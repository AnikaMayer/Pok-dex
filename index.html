<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pokédex</title>

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/type_colors.css" />
        <link rel="stylesheet" href="./styles/assets.css" />
        <link rel="stylesheet" href="./styles/cards_section.css" />
        <link rel="stylesheet" href="./styles/dialog.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="./styles/responsive.css" />

        <script src="./scripts/template.js"></script>
        <script src="./scripts/api_data.js"></script>
        <script src="./scripts/search.js"></script>
        <script src="./scripts/dialog.js"></script>
        <script src="script.js" defer></script>

        <link rel="shortcut icon" href="./assets/img/pokeball-icon.png" type="image/x-icon" />
    </head>
    <body id="page_top" onload="init()">
        <header class="main_header">
            <a aria-label="go to page-top" href="#page_top">
                <h1>PoKé<span>DeX</span></h1>
            </a>
            <nav class="search_bar">
                <div class="search_wrapper">
                    <div class="input_box">
                        <input
                            id="search_input"
                            class="search_field"
                            oninput="checkSearchInput()"
                            type="search"
                            placeholder="search by name"
                        />
                    </div>
                    <div class="btn_wrapper">
                        <button id="search_button" class="search_btn" disabled onclick="searchPkm()">
                            <img
                                id="search_img"
                                class="hide_search_img"
                                src="./assets/img/pokeball_button.png"
                                alt="Pokeball-Icon"
                            />
                        </button>
                        <button id="surprise_button" class="surprise_btn" onclick="searchRandomPkm()">
                            <img src="./assets/img/poke_dice_random.png" alt="Dice with Pokemon" />
                        </button>
                    </div>
                </div>
                <p id="hint_msg" class="hint_message hide_hint_msg">Please enter at least 3 characters!</p>
            </nav>
        </header>
        <main>
            <section class="pokemon_container">
                <ul id="pokemon_box" class="pokemon_wrap"></ul>
                <div id="loading_screen" class="loading_spin hide_spin">
                    <div class="loading_spinner"></div>
                    <p class="loading_msg">...loading</p>
                </div>
                <div class="load_more_box">
                    <button id="load_btn" onclick="loadMorePkm()">
                        <img src="./assets/img/show-more_pkm_icon.png" alt="Pokeballs-Icon" />
                        <p>Show More</p>
                    </button>
                    <button id="back_btn" class="hide_back_btn" onclick="goBack()">
                        <img src="./assets/img/pokedex_go_back_icon.png" alt="Pokedex-Icon" />
                        <p>Go Back</p>
                    </button>
                </div>
            </section>
            <dialog
                aria-label="show Pokemon details"
                id="details_dialog"
                class="dialog_container"
                onclick="closeDialog()"
            ></dialog>
        </main>
        <footer class="main_footer">
            <p>© 2026 Anika Mayer</p>
        </footer>
    </body>
</html>
