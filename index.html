<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pokédex</title>

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/type_colors.css" />
        <link rel="stylesheet" href="./styles/assets.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="./styles/responsive.css" />

        <script src="./scripts/template.js"></script>
        <script src="./scripts/api_data.js"></script>
        <script src="./scripts/search.js"></script>
        <script src="script.js" defer></script>
    </head>
    <body onload="init()">
        <header class="main_header">
            <div class="search_bar">
                <button>surprise</button>
                <div>
                    <input id="search_input" oninput="checkSearchInput()" type="search" placeholder="search by name" />
                    <p id="hint_msg" class="hint_message hidden">Please enter at least 3 characters!</p>
                </div>
                <button id="search_button" disabled onclick="searchPkm()">search</button>
            </div>
        </header>
        <main>
            <section class="pokemon_container">
                <section id="pokemon_box" class="pokemon_wrap"></section>
                <div id="loading_screen" class="hide_spin">
                    <div class="loading_spinner"></div>
                    <p>...loading</p>
                </div>
                <div class="load_more_box">
                    <button id="load_btn" onclick="loadMorePkm()">Load More</button>
                </div>
            </section>
            <dialog
                aria-label="show Pokemon details"
                id="details_dialog"
                class="dialog_container"
                onclick="closeDialog()"
            ></dialog>
        </main>
        <footer class="main_footer">footer</footer>
    </body>
</html>
